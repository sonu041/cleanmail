name: cleanmail
description: "A simple, distraction-free text-only mail viewer with easy cleanup and multi-mailbox support."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database & Persistence
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4

  # Mail API & Networking
  dio: ^5.8.0
  googleapis: ^13.2.0
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.4
  google_sign_in_platform_interface: ^2.5.0

  # HTML Parsing & Sanitization for Text Viewer
  html: ^0.15.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation for Drift
  build_runner: ^2.4.15
  drift_dev: ^2.24.2

flutter:
  uses-material-design: true
